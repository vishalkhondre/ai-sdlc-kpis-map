- id: dora-guide
  title: DORA's software delivery performance metrics
  org: DORA (Google Cloud); author Nathen Harvey
  url: https://dora.dev/guides/dora-metrics/
  published: last updated 2026-01-05
  accessed: '2026-11-27'
  status: verified
  claims:
  - 'Five metrics. Throughput: change lead time, deployment frequency, failed deployment recovery time. Instability:
    change fail rate, deployment rework rate.'
  - 'Change lead time: the amount of time it takes for a change to go from committed to version control to deployed
    in production.'
  - 'Deployment frequency: the number of deployments over a given period or the time between deployments.'
  - 'Failed deployment recovery time: the time it takes to recover from a deployment that fails and requires immediate
    intervention.'
  - 'Change fail rate: the ratio of deployments that require immediate intervention following a deployment.'
  - 'Deployment rework rate: the ratio of deployments that are unplanned but happen as a result of an incident in
    production.'

