<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="f-lt-t f-lt-d" class="sysfig">
<title id="f-lt-t">The span that lead time for changes measures</title>
<desc id="f-lt-d">Three panels left to right: version control with the commit (t0), review and pipeline with pull request opened, approved and checks passed, and production with the deploy (t1). A dashed green line under the panels marks the measured span from t0 to t1.</desc>
<defs>
<pattern id="lt-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#E4E6EB"/></pattern>
<marker id="lt-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8F94A3"/></marker>
<marker id="lt-ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#059669"/></marker>
</defs>
<rect width="900" height="300" fill="url(#lt-dots)"/>
<!-- panel 1 -->
<rect x="30" y="40" width="230" height="96" rx="4" fill="#fff" stroke="#CBCED6"/>
<path d="M30 44a4 4 0 0 1 4-4h222a4 4 0 0 1 4 4v24H30z" fill="#F7F7F8"/><line x1="30" x2="260" y1="68" y2="68" stroke="#E4E4E7"/>
<text x="42" y="58.5" class="ph">VERSION CONTROL</text><text x="248" y="58.5" text-anchor="end" class="pt">start</text>
<g transform="translate(42,79)" class="ic"><path d="M8 2v12M4 8a4 4 0 1 0 8 0 4 4 0 1 0-8 0"/></g>
<text x="68" y="91" class="pl">Commit</text><text x="248" y="91" text-anchor="end" class="pt">t0</text>
<line x1="30" x2="260" y1="102" y2="102" stroke="#EDEEF2"/>
<g transform="translate(42,111)" class="ic"><path d="M3 8h10M9 4l4 4-4 4"/></g>
<text x="68" y="123" class="pl">Push to branch</text>
<!-- arrow -->
<path d="M260 88H321" stroke="#8F94A3" marker-end="url(#lt-ar)"/>
<text x="290" y="80" text-anchor="middle" class="el">opens</text>
<!-- panel 2 -->
<rect x="325" y="40" width="250" height="130" rx="4" fill="#fff" stroke="#CBCED6"/>
<path d="M325 44a4 4 0 0 1 4-4h242a4 4 0 0 1 4 4v24H325z" fill="#F7F7F8"/><line x1="325" x2="575" y1="68" y2="68" stroke="#E4E4E7"/>
<text x="337" y="58.5" class="ph">REVIEW &amp; PIPELINE</text><text x="563" y="58.5" text-anchor="end" class="pt">wait + work</text>
<g transform="translate(337,79)" class="ic"><path d="M2 3h12v8H6l-4 3z"/></g>
<text x="363" y="91" class="pl">Pull request opened</text>
<line x1="325" x2="575" y1="102" y2="102" stroke="#EDEEF2"/>
<g transform="translate(337,111)" class="ic"><path d="M8 7a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM3 14c0-3 2.2-5 5-5s5 2 5 5"/></g>
<text x="363" y="123" class="pl">Review approved</text>
<line x1="325" x2="575" y1="136" y2="136" stroke="#EDEEF2"/>
<g transform="translate(337,145)" class="ic"><path d="M3 8.5l3 3 7-7"/></g>
<text x="363" y="157" class="pl">Checks passed</text>
<path d="M575 88H636" stroke="#8F94A3" marker-end="url(#lt-ar)"/>
<text x="605" y="80" text-anchor="middle" class="el">deploys</text>
<!-- focal panel -->
<rect x="640" y="56" width="230" height="64" rx="6" fill="#EEF1FD" stroke="#4C66E6" stroke-width="1.5"/>
<rect x="715" y="47" width="80" height="17" rx="3" fill="#fff" stroke="#4C66E6"/>
<text x="755" y="59.5" text-anchor="middle" class="pill" fill="#4C66E6">PRODUCTION</text>
<g transform="translate(656,80)" class="ic" style="stroke:#4C66E6"><path d="M2 12l4-8 4 5 4-7"/></g>
<text x="682" y="92" class="pl" font-weight="600">Deploy succeeds</text><text x="858" y="92" text-anchor="end" class="pt">t1</text>
<!-- measured span -->
<path d="M60 205H836" fill="none" stroke="#059669" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#lt-ag)"/>
<line x1="60" x2="60" y1="140" y2="212" stroke="#059669" stroke-dasharray="2 3"/>
<line x1="840" x2="840" y1="124" y2="212" stroke="#059669" stroke-dasharray="2 3"/>
<rect x="395" y="190" width="110" height="17" rx="3" fill="#fff" stroke="#059669"/>
<text x="450" y="202.5" text-anchor="middle" class="pill" fill="#059669">MEASURED</text>
<text x="450" y="232" text-anchor="middle" class="pl" fill="#065F46">lead time = t1 − t0</text>
<text x="30" y="282" class="lg">t0 = commit timestamp · t1 = production deploy timestamp · one value per change, median per period</text>
</svg>
