name: Validate

# Runs checks only. Publishes nothing (D-005).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Preview build
        run: python site/generate.py --preview
      - name: Site tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Browser checks
        run: python scripts/check_browser.py
      - name: Release build (refuses provisional content)
        if: ${{ inputs.release }}
        run: python site/generate.py
      - name: Upload site
        if: ${{ inputs.release }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
